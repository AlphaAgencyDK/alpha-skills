<!DOCTYPE html>
<!--
  alpha.ai template: DASHBOARD. A stylised screen from a custom system.
  Edit:
    <p class="eyebrow">     short label in capitals.
    <h1 class="headline">   2 short lines.
    .url                    the address in the browser bar.
    .nav li                 menu items (first one is .active).
    .kpi                    three figures with labels.
    .bars span              bar heights in % (style="height:..%").
    <p class="footer-line"> the punchline. <span class="em"> makes a word extrabold.
  Figures must be invented or come from a published case. Never paste real client data.
  Follows Alpha AI Brand Guide 05. Do not edit the logo SVG or the colour tokens.
-->
<html lang="da">
<head>
<meta charset="utf-8">
<title>alpha.ai dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=block" rel="stylesheet">
<style>
  :root { --orange:#E55B00; --highlight:#FF6600; --pale:#FCF4EE; --text:#000000; --logo-a:#000000; --logo-ai:#E55B00; }
  * { margin:0; padding:0; box-sizing:border-box; letter-spacing:0; }
  html, body { width:100%; height:100%; background:var(--pale); }
  .card {
    width:100vw; height:100vh; position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    padding:110px 92px 170px; background:var(--pale); border:14px solid var(--orange);
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
  }
  .card::before {
    content:""; position:absolute; top:-280px; right:-240px; width:620px; height:620px;
    background:radial-gradient(circle, rgba(229,91,0,0.16) 0%, rgba(229,91,0,0) 70%);
  }
  .eyebrow { color:var(--orange); font-weight:600; font-size:28px; text-transform:uppercase; margin-bottom:22px; position:relative; }
  .headline { color:var(--text); font-weight:800; font-size:78px; line-height:1.04; position:relative; }
  .stage { flex:1; display:flex; align-items:center; position:relative; z-index:2; }
  .window { width:100%; background:#FFFFFF; border-radius:26px; overflow:hidden; box-shadow:0 30px 60px rgba(229,91,0,0.14); }
  .chrome { display:flex; align-items:center; gap:10px; padding:20px 26px; border-bottom:2px solid var(--pale); }
  .chrome i { width:16px; height:16px; border-radius:50%; display:block; background:var(--orange); }
  .chrome i + i { background:var(--highlight); opacity:0.6; }
  .chrome i + i + i { background:var(--pale); opacity:1; border:2px solid var(--orange); }
  .url { margin-left:16px; font-size:26px; color:var(--text); font-weight:400; }
  .body { display:flex; min-height:420px; }
  .nav { width:210px; background:#000000; padding:26px 16px; list-style:none; }
  .nav li { color:#FFFFFF; font-size:24px; font-weight:400; padding:14px 16px; border-radius:12px; margin-bottom:6px; }
  .nav li.active { background:var(--orange); font-weight:600; }
  .main { flex:1; padding:32px; display:flex; flex-direction:column; gap:32px; }
  .kpis { display:flex; gap:18px; }
  .kpi { flex:1; background:var(--pale); border-radius:18px; padding:22px; }
  .kpi b { display:block; font-size:46px; font-weight:800; color:var(--text); }
  .kpi span { font-size:22px; color:var(--text); font-weight:400; }
  .bars { flex:1; display:flex; align-items:flex-end; gap:16px; min-height:170px; }
  .bars span { flex:1; background:var(--orange); border-radius:8px 8px 0 0; }
  .footer-line { position:relative; z-index:2; color:var(--text); font-weight:400; font-size:36px; }
  .footer-line .em { font-weight:800; }
  .logo-slot { position:absolute; z-index:2; left:50%; bottom:76px; transform:translateX(-50%); }
  .logo { display:block; width:210px; height:auto; }
  .lg-a { fill:var(--logo-a); } .lg-ai { fill:var(--logo-ai); }
  /* Square format: less height, so tighten everything */
  @media (max-height:1100px) {
    .card { padding:76px 84px 140px; }
    .headline { font-size:62px; }
    .body { min-height:320px; }
    .nav li { font-size:21px; padding:10px 14px; }
    .kpi b { font-size:38px; }
    .bars { min-height:100px; }
    .footer-line { font-size:30px; }
    .logo-slot { bottom:56px; }
    .logo { width:190px; }
  }
</style>
</head>
<body>

    <h1 class="headline">Jeres system.<br>Jeres data.</h1>

          </div>
        </div>
      </div>
    </div>
