<!DOCTYPE html>
<!--
  alpha.ai template: ORANGE. A short, loud brand statement on full orange.
  Edit:
    <p class="eyebrow">     short label in capitals (optional, delete the line to drop it).
    <h1 class="headline">   2-4 words work best. <span class="dark"> makes words near-black.
    <p class="subline">     supporting line. <span class="em"> makes words bold.
-->
<html lang="da">
<head>
<meta charset="utf-8">
<title>alpha.ai orange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  :root { --orange:#F97316; --ink:#1C1C1E; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:var(--orange); }
  .card {
    width:100vw; height:100vh; position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:center;
    padding:110px 100px; background:var(--orange);
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
  }
  .card::after {
    content:""; position:absolute; bottom:-300px; left:-260px; width:640px; height:640px;
    background:radial-gradient(circle, rgba(160,60,0,0.28) 0%, rgba(160,60,0,0) 70%);
  }
  .content { position:relative; z-index:2; }
  .eyebrow { color:rgba(255,255,255,0.82); font-weight:700; font-size:30px; letter-spacing:0.14em; text-transform:uppercase; margin-bottom:40px; }
  .headline { color:#FFFFFF; font-weight:800; font-size:150px; line-height:0.98; letter-spacing:-0.045em; }
  .headline .dark { color:var(--ink); }
  .divider { width:104px; height:6px; background:#FFFFFF; border-radius:99px; margin:52px 0 46px; }
  .subline { color:#FFFFFF; font-weight:500; font-size:44px; line-height:1.28; letter-spacing:-0.01em; max-width:760px; }
  .subline .em { font-weight:800; }
  .wordmark { position:absolute; z-index:2; right:100px; bottom:90px; font-size:34px; font-weight:700; letter-spacing:-0.02em; color:#FFFFFF; }
  .wordmark .dot { color:var(--ink); }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <p class="eyebrow">I ejer det hele</p>
      <h1 class="headline">Eje,<br>ikke <span class="dark">leje</span>.</h1>
      <div class="divider"></div>
      <p class="subline">Bygget af alpha.ai. <span class="em">Ejet 100% af jer</span>, fra dag ét.</p>
    </div>
    <div class="wordmark">alpha<span class="dot">.ai</span></div>
  </div>
</body>
</html>
