<!DOCTYPE html>
<!--
  alpha.ai template: BIG NUMBER. A result figure from a public case.
  Edit:
    <span class="number">  the figure (keep it short: 1-3 characters read best).
    <span class="unit">    the unit after it ("uger", "timer", "%").
    <h1 class="headline">  what the number means.
    <p class="subline">    the proof. <span class="em"> makes a word dark and bold.
  Only use figures from a published case (alphaagency.ai/cases) or one the client approved.
-->
<html lang="da">
<head>
<meta charset="utf-8">
<title>alpha.ai big number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  :root { --orange:#F97316; --bg:#FFFFFF; --text:#242424; --muted:#6B6B6F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:var(--bg); }
  .card {
    width:100vw; height:100vh; position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:center;
    padding:110px 100px; background:var(--bg); border:14px solid var(--orange);
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
  }
  .card::before {
    content:""; position:absolute; top:-280px; right:-240px; width:620px; height:620px;
    background:radial-gradient(circle, rgba(249,115,22,0.14) 0%, rgba(249,115,22,0.05) 40%, rgba(249,115,22,0) 70%);
  }
  .content { position:relative; z-index:2; }
  .figure { display:flex; align-items:flex-end; gap:24px; margin-bottom:40px; }
  .number {
    font-size:440px; font-weight:800; line-height:0.78; letter-spacing:-0.05em;
    color:transparent; -webkit-text-stroke:7px var(--orange);
  }
  .unit { color:var(--orange); font-weight:800; font-size:88px; letter-spacing:-0.03em; line-height:1; padding-bottom:30px; }
  .headline { color:var(--text); font-weight:800; font-size:76px; line-height:1.06; letter-spacing:-0.035em; max-width:840px; }
  .divider { width:96px; height:5px; background:var(--orange); border-radius:99px; margin:42px 0 40px; }
  .subline { color:var(--muted); font-weight:500; font-size:40px; line-height:1.3; max-width:820px; }
  .subline .em { color:var(--text); font-weight:700; }
  .wordmark { position:absolute; z-index:2; right:100px; bottom:90px; font-size:34px; font-weight:700; letter-spacing:-0.02em; color:var(--text); }
  .wordmark .dot { color:var(--orange); }
  /* Square format: less height, so tighten everything */
  @media (max-height:1100px) {
    .card { padding:80px 100px; }
    .number { font-size:320px; -webkit-text-stroke-width:6px; }
    .unit { font-size:72px; padding-bottom:20px; }
    .figure { margin-bottom:30px; }
    .headline { font-size:64px; }
    .divider { margin:32px 0 30px; }
    .subline { font-size:36px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="figure"><span class="number">5</span><span class="unit">uger</span></div>
      <h1 class="headline">Fra tungt regneark til et færdigt system.</h1>
      <div class="divider"></div>
      <p class="subline">Det byggede vi til <span class="em">Vejle Boldklub</span>.<br>Skræddersyet, og ejet 100% af dem.</p>
    </div>
    <div class="wordmark">alpha<span class="dot">.ai</span></div>
  </div>
</body>
</html>
